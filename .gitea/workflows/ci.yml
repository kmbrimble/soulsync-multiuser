# Fork-only CI, now running on Gitea (the primary forge; GitHub is a read-only push mirror that only builds the GHCR image).
# Replaces upstream's build-and-test.yml on the fork (that workflow is disabled in the GitHub repo settings), because upstream's
# webui job runs `npm run check` over the whole tree and upstream carries baseline format/lint debt. Here the format + lint
# checks only cover webui/src files changed relative to origin/main; build and tests still run in full.
# The jobs below are the required status checks on main ("CI / sanity-check (pull_request)", "CI / webui (pull_request)").
# Ported from .github/workflows/fork-ci.yml: same commands, excludes, retries and guards (pinned by tests/test_fork_ci_workflow.py);
# only the runner setup changed (uv fetches Python 3.14, the runner image's Node 24 is used) and the trigger (pull requests).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity-check:
    if: github.repository == 'kmbrimble/soulsync-multiuser'
    runs-on: ubuntu-latest
    # A wedged run must fail visibly, not sit on the runner for the 6h default.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Python 3.14 venv (uv) and dependencies
        run: |
          set -euo pipefail
          pip3 install -q --break-system-packages uv
          uv venv -q --python 3.14 .venv
          uv pip install -q --python .venv/bin/python -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff
        run: python -m ruff check --output-format=github .

      - name: Build app
        run: python -m compileall api core database services scripts web_server.py wsgi.py beatport_unified_scraper.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Deselected: upstream test that races on fast runners — purge_old(days=1e-7)
        # is an 8.6 ms window (failed on fork-ci run 36092811156, passed on re-run).
        # This list must only ever shrink; pinned by tests/test_fork_ci_workflow.py.
        # --durations=25 prints the slowest tests so a slow runner can be told apart from a slow test
        # (the 3.14 run took 39 min against 19 on 3.11, almost all of it in four files); the parity test ignores it.
        run: python -m pytest --durations=25 --deselect tests/test_audiobook_recycle.py::test_purging_forgets_the_entry_it_removed

  webui:
    if: github.repository == 'kmbrimble/soulsync-multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: webui

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # Full history so origin/main...HEAD can find the merge-base.
          fetch-depth: 0

      # Node 24 comes from the runner image (matches the Dockerfile's node:24-slim webui-builder stage); actions/setup-node
      # downloads a tarball from github.com and hung on this runner once.

      - name: Install dependencies
        run: npm ci

      - name: Format and lint changed files
        run: |
          files=$(git diff --name-only --relative --diff-filter=d origin/main...HEAD -- \
            'src/*.ts' 'src/*.tsx' 'src/*.js' 'src/*.jsx' 'src/*.css')
          if [ -z "$files" ]; then
            echo "No webui/src files changed relative to origin/main; skipping."
            exit 0
          fi
          echo "$files"
          # oxlint ignores .css and oxfmt/oxlint skip ignored paths; without this flag
          # a change touching only such files fails with "No files found".
          echo "$files" | xargs npx oxfmt --check --no-error-on-unmatched-pattern
          echo "$files" | xargs npx oxlint --type-check --no-error-on-unmatched-pattern

      - name: Build webui
        run: npm run build

      # Pre-existing upstream failures at bfa2921 (fail on the untouched baseline, locally and in CI;
      # upstream's own CI never reached `npm test`). Remove an entry once upstream fixes it.
      # The last entry (import route) is different: it passes locally but fails deterministically on
      # GitHub runners (upstream timing/env issue).
      # Do not add entries here; mirrored in CLAUDE.md.
      # --retry=2: upstream's UI tests are timing-flaky on shared runners; a deterministic failure
      # still fails all 3 attempts. Python (pytest) gets no retries.
      - name: Run tests
        run: >-
          npm test --
          --retry=2
          --exclude src/platform/artwork-thumb.wiring.test.ts
          --exclude src/test/chat-overlay-share-fns.test.ts
          --exclude src/test/chat-plain-mode.test.ts
          --exclude src/test/export-coverage.test.ts
          --exclude src/routes/podcasts/-route.test.tsx
          --exclude src/routes/import/-route.test.tsx
