name: Fork - Build and Push Image (GHCR)

# Fork-only. Upstream's docker-publish.yml / dev-nightly.yml are guarded to
# Nezreka/SoulSync and left untouched; this one is guarded the other way.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'kmbrimble/soulsync-multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kmbrimble/soulsync-multiuser
          tags: |
            ghcr.io/kmbrimble/soulsync-multiuser:latest
            ghcr.io/kmbrimble/soulsync-multiuser:sha-${{ env.SHORT_SHA }}
