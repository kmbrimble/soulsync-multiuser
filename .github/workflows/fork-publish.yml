name: Fork - Build and Push Image (GHCR)

# Fork-only. Upstream's docker-publish.yml / dev-nightly.yml are guarded to
# Nezreka/SoulSync and left untouched; this one is guarded the other way.
#
# This repository is a READ-ONLY MIRROR of the primary repo on a private forge (Gitea). Never push here directly: the mirror force-syncs
# and would discard anything that exists only on GitHub. Tests gate merges on the primary; GitHub's only job is to build and publish the
# image when the mirror delivers a push to main. This workflow has no contents:write and never commits, pushes or tags.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'kmbrimble/soulsync-multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kmbrimble/soulsync-multiuser
          tags: |
            ghcr.io/kmbrimble/soulsync-multiuser:latest
            ghcr.io/kmbrimble/soulsync-multiuser:sha-${{ env.SHORT_SHA }}
